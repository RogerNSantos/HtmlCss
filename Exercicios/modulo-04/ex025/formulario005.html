<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 5</title>
</head>
<body>
    <h1>Formulário 5</h1>
    <form action="#" method="post" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" checked><label for="ismas">Masculino</label><br>
            <input type="radio" name="sexo" id="isfem"><label for="isfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favorito</legend>
            <input type="checkbox" name="basq" id="ibasq" checked><label for="ibasq">Basquete</label><br>
            <input type="checkbox" name="fut" id="ifut"><label for="ifut">Futebol</label><br>
            <input type="checkbox" name="skat" id="iskat"><label for="iskat">Skate</label><br>
            <input type="checkbox" name="nat" id="inat"><label for="inat">Natação</label><br>
            <input type="checkbox" name="ten" id="iten" checked><label for="iten">Tênis</label>
        </fieldset>
    </form>
</body>
</html>
