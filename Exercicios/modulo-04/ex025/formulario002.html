<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2</title>
</head>
<body>
    <h1>Segundo formulário</h1>
    <form action="" method="post" autocomplete="on">
        <p>
            <label for="iuser">Usuário:</label>
            <input type="text" name="iuser" id="iuser" required placeholder="Nome de usuário" minlength="6" maxlength="20" size="15" autocomplete="username">
        </p>

        <p>
            <label for="ipassword">Senha:</label>
            <input type="password" name="ipassword" id="ipassword" required placeholder="Mínimo 8 caracteres" minlength="8" maxlength="15" size="15" autocomplete="new-password">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
