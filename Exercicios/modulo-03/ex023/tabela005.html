<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style5.css">
    <title>Exercício de tabelas</title>
</head>

<body>
    <h1>Exercício de tabela</h1>

    <table>

        <colgroup>
            <col class="nome">
            <col class="sexo">
            <col class="idade">
            <col class="profissao">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>35</td>
            <td>Administradora</td>
        </tr>
        <tr>
            <td>José</td>
            <td>M</td>
            <td>46</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>F</td>
            <td>28</td>
            <td>Diretora</td>
        </tr>
        <tr>
            <td>Rogério</td>
            <td>M</td>
            <td>39</td>
            <td>Front-End</td>
        </tr>
        <tr>
            <td>Santos</td>
            <td>M</td>
            <td>43</td>
            <td>Testador</td>
        </tr>
     
    </table>

</body>

</html>
