<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <style>
        div.container {
           background-color: antiquewhite;
           display: flex;
           flex-flow: wrap;
        }

        div.item {
           background-color: lightblue;
           border: 2px solid black;
           text-align: center;
           padding: 10px;
        }

        div#i1{
            order: 0;
        }

        div#i2{
            order: 8;
        }

        div#i3{
            order: 9;
        }

        div#i4{
            order: -3;
        }

        div#i5{
            order: 1;   
        }

        div#i6{
            order: 0;
        }

        div#i7{
            order: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">Item 1</div>
        <div class="item" id="i2">Item 2</div>
        <div class="item" id="i3">Item 3</div>
        <div class="item" id="i4">Item 4</div>
        <div class="item" id="i5">Item 5</div>
        <div class="item" id="i6">Item 6</div>
        <div class="item" id="i7">Item 7</div>
    </div>
</body>
</html>
