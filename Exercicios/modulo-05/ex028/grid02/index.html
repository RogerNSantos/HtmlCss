<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    
    <style>
        div.container {
            border: 3px solid black;
            /*height: 250px;*/
            display: grid;
            /*grid-template: repeat(3, auto) / repeat(3, auto);*/
            grid-template-rows: repeat(3, 80px);
            /*grid-template-columns: repeat(3, 120px);*/
            /*grid-template-columns: 1fr 4fr 1fr;*/
            grid-template-columns: 100px 40% repeat(2, 1fr);
            grid-auto-flow: row;
            grid-auto-rows: 80px;
            grid-auto-columns: 120px;
            gap: 10px;           
            place-items: normal normal;            
            place-content: normal normal;      
        }

        div.item {
            border: 3px solid red;   
            padding: 5px;         
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Item 01</div>
        <div class="item">Item 02</div>
        <div class="item">Item 03</div>
        <div class="item">Item 04</div>
        <div class="item">Item 05</div>
        <div class="item">Item 06</div>
        <div class="item">Item 07</div>
        <div class="item">Item 08</div>
        <div class="item">Item 09</div>
        <div class="item">Item 10</div>
    </div>
</body>
</html>
